# Server
server.port=8080

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Allow schema.sql to run after JPA initializes the datasource
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=YourSuperSecretJWTKeyThatIsAtLeast256BitsLong1234567890
app.jwt.expiration-ms=86400000

# Logging
logging.level.gr.aegean=DEBUG
logging.level.org.springframework.security=INFO
